name: Build REMONTADA POS for Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop-pos/**'
      - '.github/workflows/build-pos.yml'
    branches: [main]
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-pos/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build Windows installers
        run: npm run dist:win
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: remontada-pos-windows
          path: desktop-pos/release/*.exe
          if-no-files-found: error
          retention-days: 14
