name: Build REMONTADA POS for Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop-pos/**'
      - '.github/workflows/build-pos.yml'
    branches: [main]
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set Windows app version
        shell: pwsh
        run: |
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $p.version = "1.2.${{ github.run_number }}"
          $p | ConvertTo-Json -Depth 100 | Set-Content package.json
      - name: Install dependencies
        run: npm install
      - name: Build Windows installers and update metadata
        run: npm run dist:win -- --publish never
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: REMONTADA-POS-Windows
          path: |
            desktop-pos/release/*.exe
            desktop-pos/release/latest.yml
            desktop-pos/release/*.blockmap
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows update feed
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pos-windows-latest
          name: REMONTADA POS Windows Latest
          body: إصدار Windows الرسمي. يكتشف البرنامج التحديث وينزّله تلقائيًا عند توفره.
          files: |
            desktop-pos/release/*.exe
            desktop-pos/release/latest.yml
            desktop-pos/release/*.blockmap
          overwrite_files: true
          fail_on_unmatched_files: true
