name: Build REMONTADA POS Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-pos/**'
      - 'src/pos/**'
      - '.github/workflows/build-pos-android.yml'
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install
      - name: Sync shared POS source
        run: mkdir -p src/pos && cp ../src/pos/TabletPos.tsx src/pos/ && cp ../src/pos/browserDesktop.ts src/pos/ && cp ../src/pos/webSupabase.ts src/pos/ && cp ../src/pos/pos.css src/pos/
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile-pos/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REMONTADA-POS-Android-APK
          path: mobile-pos/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
